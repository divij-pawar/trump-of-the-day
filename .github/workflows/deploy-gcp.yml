# Deploys the API to Cloud Run after CI passes on main. The website is built and
# published by Netlify on its own (netlify.toml), which proxies /api/* to Cloud Run.
#
# Authenticates with Workload Identity Federation (no service account keys).
# Inert until these repository variables are set from `terraform output` in infra/gcp:
#   GCP_PROJECT_ID, GCP_REGION, GCP_WORKLOAD_IDENTITY_PROVIDER,
#   GCP_DEPLOY_SERVICE_ACCOUNT, GCP_IMAGE_REPOSITORY
name: Deploy (GCP)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-gcp
  cancel-in-progress: false

env:
  SERVICE: trump-of-the-day-api

jobs:
  deploy:
    if: >-
      vars.GCP_PROJECT_ID != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the API image
        id: image
        env:
          REPO: ${{ vars.GCP_IMAGE_REPOSITORY }}
          TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$REPO/api:$TAG" api
          docker push "$REPO/api:$TAG"
          echo "uri=$REPO/api:$TAG" >> "$GITHUB_OUTPUT"

      - name: Roll out the new revision
        run: |
          gcloud run services update "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "${{ steps.image.outputs.uri }}" \
            --quiet

      # Cloud Run only shifts traffic once the startup probe passes; this checks
      # the public URL end to end, including the database through /readyz.
      - name: Smoke test
        run: |
          url=$(gcloud run services describe "$SERVICE" --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" --format 'value(status.url)')
          curl -fsS --retry 5 --retry-all-errors --max-time 30 "$url/livez"
          curl -fsS --retry 5 --retry-all-errors --max-time 30 "$url/readyz"
