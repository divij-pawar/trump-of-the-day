# Deploys the API to ECS and the frontend to S3/CloudFront. Manual only: the live
# site runs on GCP (deploy-gcp.yml); the AWS stack is brought up on demand.
#
# Uses GitHub OIDC to assume the deploy role from infra/aws (no AWS keys
# stored in GitHub). Inert until the infrastructure exists: set these repository
# variables from `terraform output`:
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, ECR_REPOSITORY_URL, ECS_CLUSTER, ECS_SERVICE,
#   FRONTEND_BUCKET, CLOUDFRONT_DISTRIBUTION_ID
name: Deploy (AWS)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  api:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        id: image
        env:
          REPO: ${{ vars.ECR_REPOSITORY_URL }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$REPO:$TAG" -t "$REPO:latest" api
          docker push "$REPO:$TAG"
          docker push "$REPO:latest"
          echo "uri=$REPO:$TAG" >> "$GITHUB_OUTPUT"
      - name: Render task definition with the new image
        run: |
          aws ecs describe-task-definition --task-definition "${{ vars.ECS_SERVICE }}" \
            --query taskDefinition > task-def.json
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: api
          image: ${{ steps.image.outputs.uri }}
      - name: Deploy and wait for the service to stabilize
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true

  frontend:
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload to S3
        run: |
          # Hashed assets are immutable; index.html must always revalidate.
          aws s3 sync dist "s3://${{ vars.FRONTEND_BUCKET }}" --delete \
            --exclude index.html --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html "s3://${{ vars.FRONTEND_BUCKET }}/index.html" \
            --cache-control "no-cache"
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths /index.html
